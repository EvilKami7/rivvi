services:
  db:
    image: postgres:16-alpine
    container_name: rivvi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: rivvi
      POSTGRES_PASSWORD: rivvi
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rivvi -d mydb']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: service/Dockerfile
    environment:
      DATABASE_URL: postgresql://rivvi:rivvi@db:5432/mydb?schema=public
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
      - backend_service_node_modules:/app/service/node_modules

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://backend:3000
    ports:
      - '5173:5173'
    depends_on:
      - backend
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_client_node_modules:/app/client/node_modules

volumes:
  postgres_data:
  backend_node_modules:
  backend_service_node_modules:
  frontend_node_modules:
  frontend_client_node_modules:
